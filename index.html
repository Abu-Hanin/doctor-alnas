<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دكتور الناس - دليل الأطباء</title>
<meta name="theme-color" content="#F0B90B">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#0B0E11;color:#FFF;direction:rtl;min-height:100vh;line-height:1.6}
.container{max-width:700px;margin:0 auto;padding:0 14px}
.site-header{background:rgba(11,14,17,0.98);backdrop-filter:blur(10px);padding:12px 0 10px;border-bottom:1px solid #1E2329;position:sticky;top:0;z-index:100}
.header-top-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo{font-size:1.4rem;font-weight:900;color:#F0B90B;cursor:pointer;text-shadow:0 0 20px rgba(240,185,11,0.6)}
.pulse-dot{display:inline-block;width:8px;height:8px;background:#0ECB81;border-radius:50%;margin-right:4px;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,203,129,0.8)}70%{box-shadow:0 0 0 10px rgba(14,203,129,0)}100%{box-shadow:0 0 0 0 rgba(14,203,129,0)}}
.header-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn-header{padding:7px 14px;border-radius:20px;font-size:0.78rem;font-weight:700;border:none;cursor:pointer;font-family:inherit;position:relative}
.btn-login{background:#F0B90B;color:#0B0E11}
.btn-register{background:transparent;color:#0ECB81;border:1px solid #0ECB81}
.btn-logout{background:transparent;color:#F6465D;border:1px solid #F6465D}
.notif-dot{position:absolute;top:-3px;left:-3px;width:14px;height:14px;background:#0ECB81;border-radius:50%;border:2px solid #0B0E11;animation:pulse 1.5s infinite}
.install-btn-row{width:100%;margin-top:10px;background:linear-gradient(135deg,#0ECB81,#0AB872);color:#FFF;border:none;padding:11px;border-radius:12px;font-family:inherit;font-size:0.88rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.hidden{display:none!important}
.hero{padding:24px 0 16px;text-align:center}
.hero-title{font-size:1.25rem;font-weight:900;margin-bottom:4px}
.hero-title span{color:#F0B90B}
.hero-sub{color:#707A8A;font-size:0.8rem;margin-bottom:14px}
.search-box{background:#1E2329;border:1px solid #2B3139;border-radius:40px;padding:4px;display:flex;max-width:480px;margin:0 auto}
.search-box input{flex:1;border:none;outline:none;padding:10px 18px;background:transparent;color:#FFF;font-family:inherit;font-size:0.88rem}
.search-box button{background:#F0B90B;color:#0B0E11;border:none;padding:9px 20px;border-radius:30px;cursor:pointer;font-weight:800;font-family:inherit;font-size:0.82rem}
.section-header{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;padding-bottom:8px;border-bottom:1px solid #1E2329}
.section-header h2{color:#F0B90B;font-size:0.95rem;font-weight:900}
.count-badge{background:#F0B90B;color:#0B0E11;font-size:0.7rem;font-weight:900;padding:2px 9px;border-radius:20px}
.doctors-list{display:flex;flex-direction:column;gap:12px}
.doc-card{background:#1E2329;border:1px solid #2B3139;border-radius:16px;padding:16px;display:grid;grid-template-columns:100px 1fr 20px;gap:14px;cursor:pointer;align-items:center;transition:all 0.2s}
.doc-card:hover{border-color:#F0B90B;background:#232830;transform:translateY(-2px)}
.doc-avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #F0B90B}
.doc-avatar-ph{width:100px;height:100px;border-radius:50%;border:3px solid #F0B90B;background:#0B0E11;display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.doc-info{display:flex;flex-direction:column;gap:5px;min-width:0}
.doc-name{font-size:1.05rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-spec{color:#F0B90B;font-weight:700;font-size:0.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-loc{color:#B7BDC6;font-size:0.78rem}
.doc-arrow{color:#F0B90B;opacity:0.5}
.empty-msg{text-align:center;padding:40px 20px;background:#1E2329;border:1px dashed #2B3139;border-radius:14px;color:#707A8A;font-size:0.9rem}
.form-container{max-width:520px;margin:30px auto;background:#1E2329;border-radius:16px;border:1px solid #2B3139;padding:24px}
.form-container h2{color:#F0B90B;text-align:center;margin-bottom:6px;font-weight:900}
.form-subtitle{text-align:center;color:#707A8A;font-size:0.85rem;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:0.88rem}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:12px;background:#0B0E11;border:1px solid #2B3139;border-radius:10px;color:#FFF;font-family:inherit;font-size:0.9rem;outline:none}
.form-group input:focus,.form-group textarea:focus{border-color:#F0B90B;box-shadow:0 0 0 3px rgba(240,185,11,0.1)}
.form-group textarea{min-height:80px;resize:vertical}
.form-group small{color:#707A8A;font-size:0.75rem;display:block;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:30px;font-weight:800;cursor:pointer;border:none;font-family:inherit;font-size:0.9rem;width:100%;transition:all 0.2s}
.btn-primary{background:#F0B90B;color:#0B0E11}
.btn-success{background:#0ECB81;color:#FFF}
.btn-danger{background:#F6465D;color:#FFF}
.btn-sm{padding:6px 12px;font-size:0.75rem;width:auto}
.alert{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-weight:600;font-size:0.88rem;text-align:center}
.alert-success{background:rgba(14,203,129,0.15);color:#0ECB81;border:1px solid #0ECB81}
.alert-danger{background:rgba(246,70,93,0.15);color:#F6465D;border:1px solid #F6465D}
.doctor-full-page{max-width:700px;margin:20px auto;background:#1E2329;border:1px solid #2B3139;border-radius:16px;overflow:hidden}
.dfp-hero{background:linear-gradient(135deg,#1E2329,#232830);padding:30px 20px;text-align:center;border-bottom:1px solid #2B3139}
.dfp-avatar{width:130px;height:130px;border-radius:50%;border:4px solid #F0B90B;object-fit:cover;margin:0 auto 15px;display:block;box-shadow:0 0 25px rgba(240,185,11,0.4)}
.dfp-avatar-ph{width:130px;height:130px;border-radius:50%;border:4px solid #F0B90B;background:#0B0E11;display:flex;align-items:center;justify-content:center;font-size:3.5rem;margin:0 auto 15px}
.dfp-hero h1{color:#F0B90B;font-size:1.5rem;font-weight:900;margin-bottom:6px}
.dfp-spec{font-weight:700;margin-bottom:4px}
.dfp-sub{color:#707A8A;font-size:0.85rem;margin-bottom:16px}
.dfp-call{display:inline-block;background:#0ECB81;color:#FFF;padding:12px 30px;border-radius:30px;font-weight:800;text-decoration:none}
.dfp-body{padding:18px}
.dfp-card{background:#0B0E11;border:1px solid #2B3139;border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.dfp-icon{font-size:1.4rem;width:40px;height:40px;background:#1E2329;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dfp-label{color:#707A8A;font-size:0.75rem}
.dfp-value{font-weight:600;font-size:0.9rem}
.dfp-section{background:#0B0E11;border:1px solid #2B3139;border-radius:10px;padding:16px;margin-bottom:10px}
.dfp-section h3{color:#F0B90B;font-size:0.95rem;margin-bottom:10px}
.dfp-section p{font-size:0.88rem;line-height:1.8}
.dfp-back{display:block;text-align:center;background:transparent;border:1px solid #2B3139;color:#FFF;padding:12px;border-radius:10px;font-weight:700;margin-top:16px;cursor:pointer;width:100%;font-family:inherit;font-size:0.9rem}
.dash-container{max-width:720px;margin:20px auto;padding:0 16px}
.dash-header{background:#1E2329;border:1px solid #2B3139;border-radius:12px;padding:20px;display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.form-section{background:#1E2329;border:1px solid #2B3139;border-radius:12px;padding:18px;margin-bottom:16px}
.form-section h3{color:#F0B90B;font-size:1rem;margin-bottom:14px;border-bottom:1px solid #2B3139;padding-bottom:10px}
.status-badge{padding:6px 14px;border-radius:20px;font-weight:700;font-size:0.82rem}
.status-pending{background:rgba(240,185,11,0.15);color:#F0B90B;border:1px solid #F0B90B}
.status-approved{background:rgba(14,203,129,0.15);color:#0ECB81;border:1px solid #0ECB81}
.status-rejected{background:rgba(246,70,93,0.15);color:#F6465D;border:1px solid #F6465D}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.stat-card{background:#1E2329;border:1px solid #2B3139;border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all 0.2s}
.stat-card:hover,.stat-card.active{border-color:#F0B90B;background:#232830}
.stat-card h3{color:#707A8A;font-size:0.8rem;margin-bottom:4px}
.stat-card p{font-size:1.6rem;font-weight:900;color:#F0B90B}
.pending-card{background:#1E2329;border:1px solid #2B3139;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;transition:all 0.2s;cursor:pointer}
.pending-card:hover{border-color:#F0B90B}
.pending-card .info{flex:1;min-width:150px}
.pending-card .info h4{font-size:0.95rem;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.pending-card .info p{color:#707A8A;font-size:0.78rem}
.unread-dot{display:inline-block;width:10px;height:10px;background:#0ECB81;border-radius:50%;animation:pulse 1.5s infinite;flex-shrink:0}
.tabs{display:flex;gap:6px;margin:20px 0;overflow-x:auto;padding-bottom:4px}
.tab{padding:10px 18px;border-radius:20px;background:#1E2329;border:1px solid #2B3139;color:#FFF;cursor:pointer;font-family:inherit;font-weight:700;font-size:0.82rem;white-space:nowrap;transition:all 0.2s;display:flex;align-items:center;gap:6px}
.tab.active{background:#F0B90B;color:#0B0E11;border-color:#F0B90B}
.tab .dot-badge{width:10px;height:10px;background:#0ECB81;border-radius:50%;animation:pulse 1.5s infinite;flex-shrink:0}
.tab.active .dot-badge{background:#0B0E11}
.chat-box{background:#1E2329;border:1px solid #2B3139;border-radius:12px;padding:16px;margin-bottom:16px;min-height:300px;max-height:500px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.chat-msg{padding:10px 14px;border-radius:12px;max-width:80%;font-size:0.88rem;line-height:1.5;word-wrap:break-word}
.chat-msg.mine{background:#F0B90B;color:#0B0E11;align-self:flex-end}
.chat-msg.them{background:#2B3139;color:#FFF;align-self:flex-start}
.chat-time{font-size:0.68rem;opacity:0.7;margin-top:4px}
.chat-input-row{display:flex;gap:8px}
.chat-input-row input{flex:1;padding:12px;background:#0B0E11;border:1px solid #2B3139;border-radius:10px;color:#FFF;font-family:inherit;font-size:0.9rem;outline:none}
.chat-input-row button{padding:12px 20px;background:#0ECB81;color:#FFF;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-family:inherit}
.site-footer{text-align:center;padding:20px;color:#707A8A;border-top:1px solid #1E2329;margin-top:24px;font-size:0.75rem}
.ios-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;padding:20px}
.ios-modal.active{display:flex}
.ios-modal-box{background:#1E2329;border:1px solid #2B3139;border-radius:16px;padding:24px;max-width:360px;text-align:center;position:relative}
.ios-modal-box h3{color:#F0B90B;font-size:1.1rem;margin-bottom:14px}
.ios-modal-box p{color:#B7BDC6;font-size:0.88rem;line-height:1.8;margin-bottom:8px}
.close-x{position:absolute;top:10px;left:14px;background:transparent;border:none;color:#707A8A;font-size:1.5rem;cursor:pointer}
.loading{text-align:center;padding:40px;color:#F0B90B}
.img-preview{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #F0B90B;margin:10px auto;display:block}
.file-input-label{display:block;background:#0B0E11;border:2px dashed #2B3139;border-radius:12px;padding:20px;text-align:center;cursor:pointer;color:#707A8A;transition:all 0.2s;font-size:0.9rem}
.file-input-label:hover{border-color:#F0B90B;color:#F0B90B}
.file-input-label input{display:none}
.center-toggle{width:100%;background:transparent;border:1px solid #2B3139;color:#F0B90B;padding:14px;border-radius:12px;font-family:inherit;font-weight:800;font-size:0.92rem;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.center-toggle:hover{border-color:#F0B90B;background:rgba(240,185,11,0.05)}
.center-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;transition:all 0.3s}
.center-btn{padding:10px 8px;background:#0B0E11;border:1px solid #2B3139;border-radius:12px;color:#FFF;cursor:pointer;font-family:inherit;font-weight:700;font-size:0.78rem;transition:all 0.2s;text-align:center}
.center-btn:hover{border-color:#F0B90B;color:#F0B90B}
.center-btn.active{background:#F0B90B;color:#0B0E11;border-color:#F0B90B}
.support-btn{background:linear-gradient(135deg,#25D366,#128C7E);color:#FFF;border-color:#25D366}
@media (max-width:500px){
.doc-card{grid-template-columns:90px 1fr 16px;padding:14px;gap:12px}
.doc-avatar,.doc-avatar-ph{width:90px;height:90px;font-size:2.1rem}
.doc-name{font-size:0.98rem}
.stats-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<header class="site-header">
<div class="container">
<div class="header-top-row">
<a class="logo" onclick="go('home')">دكتور الناس<span class="pulse-dot"></span></a>
<div class="header-actions" id="header-actions"></div>
</div>
<button id="installBtn" class="install-btn-row hidden" onclick="installApp()">📲 ثبّت التطبيق على هاتفك</button>
</div>
</header>

<main id="app"><div class="loading">⏳ جارٍ التحميل...</div></main>

<footer class="site-footer">© <span id="year"></span> دكتور الناس — جميع الحقوق محفوظة</footer>

<div class="ios-modal" id="installModal" onclick="if(event.target===this)closeModal()">
<div class="ios-modal-box">
<button class="close-x" onclick="closeModal()">×</button>
<div id="modal-content"></div>
</div>
</div>

<script>
const SUPABASE_URL='https://wfcizftmcclhnzgvukuy.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmY2l6ZnRtY2NsaG56Z3Z1a3V5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNDI3ODYsImV4cCI6MjEwNDYxODc4Nn0.HZ852U2kZzHkXQveGEWT0qLra-vsVOwZOsT1Zl8nQ80';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentDoctor=null,isAdmin=false;
let unreadForDoctor=0,unreadForAdmin=0;
let centersOpen=false;
const $=s=>document.querySelector(s);
const esc=str=>{if(!str)return'';const d=document.createElement('div');d.textContent=str;return d.innerHTML;};
const go=(page,param)=>{window.location.hash=param?`#${page}/${param}`:`#${page}`;};

async function route(){
const hash=window.location.hash.slice(1)||'home';
const[page,param]=hash.split('/');
const app=$('#app');
app.innerHTML='<div class="loading">⏳ جارٍ التحميل...</div>';
try{
if(page==='home')await renderHome(app);
else if(page==='doctor')await renderDoctor(app,param);
else if(page==='login')renderLogin(app);
else if(page==='register')renderRegister(app);
else if(page==='doctor-dashboard')await renderDoctorDashboard(app);
else if(page==='admin')await renderAdmin(app);
else await renderHome(app);
}catch(e){app.innerHTML=`<div class="container"><div class="alert alert-danger">خطأ: ${esc(e.message)}</div></div>`;}
window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

async function checkUser(){
const{data:{user}}=await supabaseClient.auth.getUser();
currentUser=user;currentDoctor=null;isAdmin=false;unreadForDoctor=0;unreadForAdmin=0;
if(user){
const{data:d}=await supabaseClient.from('doctors').select('*').eq('user_id',user.id).maybeSingle();
currentDoctor=d;
const{data:aList}=await supabaseClient.from('admins').select('id').eq('user_id',user.id).limit(1);
isAdmin=aList&&aList.length>0;
if(currentDoctor){
const{count}=await supabaseClient.from('messages').select('*',{count:'exact',head:true}).eq('doctor_id',currentDoctor.id).eq('sender_type','admin').eq('read_by_doctor',false);
unreadForDoctor=count||0;
}
if(isAdmin){
const{count}=await supabaseClient.from('messages').select('*',{count:'exact',head:true}).eq('sender_type','doctor').eq('read_by_admin',false);
unreadForAdmin=count||0;
}
}
renderHeaderActions();
}

async function refreshUnread(){
if(!currentUser)return;
let changed=false;
if(currentDoctor){
const{count}=await supabaseClient.from('messages').select('*',{count:'exact',head:true}).eq('doctor_id',currentDoctor.id).eq('sender_type','admin').eq('read_by_doctor',false);
const n=count||0;
if(n!==unreadForDoctor){unreadForDoctor=n;changed=true;}
}
if(isAdmin){
const{count}=await supabaseClient.from('messages').select('*',{count:'exact',head:true}).eq('sender_type','doctor').eq('read_by_admin',false);
const n=count||0;
if(n!==unreadForAdmin){unreadForAdmin=n;changed=true;}
}
if(changed)renderHeaderActions();
}

function renderHeaderActions(){
const a=$('#header-actions');
if(isAdmin){
a.innerHTML=`<button class="btn-header btn-login" onclick="go('admin')">⚙️ الإدارة${unreadForAdmin>0?'<span class="notif-dot"></span>':''}</button><button class="btn-header btn-logout" onclick="logout()">خروج</button>`;
}else if(currentUser){
a.innerHTML=`<button class="btn-header btn-login" onclick="go('doctor-dashboard')">👨‍⚕️ لوحتي${unreadForDoctor>0?'<span class="notif-dot"></span>':''}</button><button class="btn-header btn-logout" onclick="logout()">خروج</button>`;
}else{
a.innerHTML=`<button class="btn-header btn-login" onclick="go('login')">🔑 دخول</button><button class="btn-header btn-register" onclick="go('register')">📝 حساب جديد</button>`;
}
}

function contactSupport(){
const phone='201154846407';
const msg=encodeURIComponent('مرحباً، أحتاج مساعدة بخصوص حسابي في دكتور الناس');
window.open(`https://wa.me/${phone}?text=${msg}`,'_blank');
}

async function logout(){
await supabaseClient.auth.signOut();
currentUser=null;currentDoctor=null;isAdmin=false;unreadForDoctor=0;unreadForAdmin=0;
renderHeaderActions();go('home');
}

/* ============ الرئيسية ============ */
let searchQuery='';
let currentCityFilter='';
const CENTERS=['بني سويف','الواسطى','ناصر','إهناسيا','ببا','سمسطا','الفشن'];

async function renderHome(app){
app.innerHTML=`
<section class="hero">
<div class="container">
<h1 class="hero-title">ابحث عن <span>طبيبك</span></h1>
<p class="hero-sub">ابحث باسم الطبيب أو التخصص أو المنطقة</p>
<form class="search-box" onsubmit="event.preventDefault(); doSearch(this);">
<input type="text" name="q" placeholder="🔍 اسم الطبيب أو التخصص..." value="${esc(searchQuery)}">
<button type="submit">بحث</button>
</form>
</div>
</section>

<div class="container">
<div class="form-section" style="padding:14px;margin-bottom:16px;">
<button class="center-toggle" onclick="toggleCenters()">
📍 ${currentCityFilter?'المركز: '+currentCityFilter:'اختر المركز - محافظة بني سويف'} <span id="center-arrow">${centersOpen?'▲':'▼'}</span>
</button>
<div id="centers-grid" class="center-grid" style="display:${centersOpen?'grid':'none'};">
<button class="center-btn ${currentCityFilter===''?'active':''}" onclick="filterByCity('')">🌟 الكل</button>
${CENTERS.map(c=>`<button class="center-btn ${currentCityFilter===c?'active':''}" onclick="filterByCity('${c}')">${c}</button>`).join('')}
</div>
</div>
</div>

<div class="container">
<div class="section-header">
<h2>👨‍⚕️ الأطباء${currentCityFilter?' - '+esc(currentCityFilter):''}</h2>
<span class="count-badge" id="doc-count">...</span>
</div>
<div id="doctors-list" class="doctors-list"><div class="loading">⏳</div></div>
</div>`;

async function loadDoctors(query='',city=''){
const list=$('#doctors-list');
let q=supabaseClient.from('doctors').select('*').eq('status','approved').eq('deleted',false).order('created_at',{ascending:false});
if(query){const t=`%${query}%`;q=q.or(`full_name.ilike.${t},specialty.ilike.${t},sub_specialty.ilike.${t},governorate.ilike.${t},city.ilike.${t}`);}
if(city){q=q.ilike('city',`%${city}%`);}
const{data,error}=await q;
if(error){list.innerHTML=`<div class="alert alert-danger">خطأ: ${esc(error.message)}</div>`;return;}
$('#doc-count').textContent=data.length;
if(data.length===0){list.innerHTML=`<div class="empty-msg">📭 لا يوجد أطباء مطابقون${city?' في '+esc(city):''}</div>`;return;}
list.innerHTML=data.map(d=>`

${d.image_url?`<img src="${esc(d.image_url)}" class="doc-avatar">`:`<div class="doc-avatar-ph">🩺</div>`}
<div class="doc-info">
<div class="doc-name">${esc(d.full_name)}</div>

</div>`).join('');
}

function previewImage(input){
if(input.files&&input.files[0]){
const reader=new FileReader();
reader.onload=e=>{
let preview=$('#current-img');
if(preview){preview.src=e.target.result;}
else{
preview=document.createElement('img');
preview.id='current-img';
preview.className='img-preview';
preview.src=e.target.result;
input.parentNode.parentNode.insertBefore(preview,input.parentNode);
}
};
reader.readAsDataURL(input.files[0]);
}
}

async function saveDoctor(f){

const{data:urlData}=supabaseClient.storage.from('doctor-images').getPublicUrl(fileName);

const fields=['full_name','specialty','sub_specialty','phone1','phone2','governorate','city','region','address','work_days','work_start','work_end','qualifications','certificates','experience','about'];

}

<div class="form-group"><label>التخصص الرئيسي</label><input type="text" id="e_specialty" value="${esc(d.specialty||'')}"></div>
<div class="form-group"><label>التخصص الدقيق</label><input type="text" id="e_sub_specialty" value="${esc(d.sub_specialty||'')}"></div>
<div class="form-group"><label>الهاتف العام 1</label><input type="tel" id="e_phone1" value="${esc(d.phone1||'')}" dir="ltr"></div>
<div class="form-group"><label>الهاتف العام 2</label><input type="tel" id="e_phone2" value="${esc(d.phone2||'')}" dir="ltr"></div>
<div class="form-group"><label>المحافظة</label><input type="text" id="e_governorate" value="${esc(d.governorate||'')}"></div>
<div class="form-group"><label>المركز</label><select id="e_city">
<option value="">اختر</option>
${CENTERS.map(c=>`<option value="${c}" ${d.city===c?'selected':''}>${c}</option>`).join('')}
</select></div>
<div class="form-group"><label>المنطقة</label><input type="text" id="e_region" value="${esc(d.region||'')}"></div>
<div class="form-group"><label>العنوان</label><textarea id="e_address">${esc(d.address||'')}</textarea></div>
<div class="form-group"><label>أيام العمل</label><input type="text" id="e_work_days" value="${esc(d.work_days||'')}"></div>
<div class="form-group"><label>من الساعة</label><input type="text" id="e_work_start" value="${esc(d.work_start||'')}"></div>
<div class="form-group"><label>إلى الساعة</label><input type="text" id="e_work_end" value="${esc(d.work_end||'')}"></div>
<div class="form-group"><label>المؤهلات</label><textarea id="e_qualifications">${esc(d.qualifications||'')}</textarea></div>
<div class="form-group"><label>الشهادات</label><textarea id="e_certificates">${esc(d.certificates||'')}</textarea></div>
<div class="form-group"><label>الخبرات</label><textarea id="e_experience">${esc(d.experience||'')}</textarea></div>

</div>
<button onclick="adminSaveDoctor('${d.id}')" class="btn btn-primary" style="margin-bottom:10px;">💾 حفظ التعديلات</button>
<button onclick="approveDoc('${d.id}')" class="btn btn-success" style="margin-bottom:10px;">✅ قبول</button>
<button onclick="rejectDoc('${d.id}')" class="btn btn-danger" style="margin-bottom:20px;">❌ رفض</button>`;
}

async function adminSaveDoctor(id){
const u={
full_name:$('#e_full_name').value.trim(),
phone_private:$('#e_phone_private').value.trim(),
specialty:$('#e_specialty').value.trim(),
sub_specialty:$('#e_sub_specialty').value.trim(),
phone1:$('#e_phone1').value.trim(),
phone2:$('#e_phone2').value.trim(),
governorate:$('#e_governorate').value.trim(),
city:$('#e_city').value.trim(),
region:$('#e_region').value.trim(),
address:$('#e_address').value.trim(),
work_days:$('#e_work_days').value.trim(),
work_start:$('#e_work_start').value.trim(),
work_end:$('#e_work_end').value.trim(),
qualifications:$('#e_qualifications').value.trim(),
certificates:$('#e_certificates').value.trim(),
experience:$('#e_experience').value.trim(),
about:$('#e_about').value.trim()
};
const{error}=await supabaseClient.from('doctors').update(u).eq('id',id);
const al=$('#edit-alert');
if(error){al.innerHTML=`<div class="alert alert-danger">خطأ: ${esc(error.message)}</div>`;return;}
al.innerHTML='<div class="alert alert-success">✅ تم حفظ التعديلات</div>';
}

async function renderAdminMessagesPage(){
const c=$('#admin-page-content');
const{data:messages}=await supabaseClient.from('messages').select('*').order('created_at',{ascending:false}).limit(500);
const{data:doctors}=await supabaseClient.from('doctors').select('id,full_name,email').eq('deleted',false);
const doctorMap={};
(doctors||[]).forEach(d=>{doctorMap[d.id]=d;});
const grouped={};
(messages||[]).forEach(m=>{if(!grouped[m.doctor_id])grouped[m.doctor_id]=[];grouped[m.doctor_id].push(m);});
const chatList=Object.keys(grouped).map(id=>{
const msgs=grouped[id];
const unread=msgs.filter(m=>m.sender_type==='doctor'&&!m.read_by_admin).length;
return{doctorId:id,doctor:doctorMap[id]||{full_name:'غير معروف'},last:msgs[0],unread};
}).sort((a,b)=>b.unread-a.unread);
c.innerHTML=`
<h3 style="color:#F0B90B;margin:16px 0;">💬 المحادثات (${chatList.length})</h3>
${chatList.length===0?'<div class="empty-msg">لا توجد رسائل بعد</div>':
chatList.map(x=>`
<div class="pending-card" onclick="openAdminChat('${x.doctorId}')">
<div class="info">
<h4>${x.unread>0?'<span class="unread-dot"></span>':''} ${esc(x.doctor.full_name)}</h4>
<p>${esc(x.last.content.substring(0,60))}${x.last.content.length>60?'...':''}</p>
<p style="color:#707A8A;font-size:0.7rem;">${new Date(x.last.created_at).toLocaleString('ar-EG')}</p>
</div>
<span style="color:#F0B90B;font-size:1.3rem;">◀</span>
</div>`).join('')}`;
}

async function openAdminChat(doctorId){
const{data:d}=await supabaseClient.from('doctors').select('*').eq('id',doctorId).single();
const{data:msgs}=await supabaseClient.from('messages').select('*').eq('doctor_id',doctorId).order('created_at',{ascending:true});
await supabaseClient.from('messages').update({read_by_admin:true}).eq('doctor_id',doctorId).eq('sender_type','doctor').eq('read_by_admin',false);
await refreshUnread();
$('#admin-page-content').innerHTML=`
<button onclick="renderAdminMessagesPage()" class="btn btn-primary" style="margin:16px 0;">← رجوع للمحادثات</button>
<div class="dash-header">
<div style="flex:1;">
<h2 style="color:#F0B90B;">💬 ${esc(d.full_name)}</h2>
<p style="color:#707A8A;font-size:0.82rem;">${esc(d.email)}</p>
</div>
</div>
<div class="chat-box" id="admin-chat">
${(msgs||[]).length===0?'<p style="text-align:center;color:#707A8A;">لا توجد رسائل</p>':
(msgs||[]).map(m=>`
<div class="chat-msg ${m.sender_type==='admin'?'mine':'them'}">
<div>${esc(m.content)}</div>
<div class="chat-time">${new Date(m.created_at).toLocaleString('ar-EG')}</div>
</div>`).join('')}
</div>
<div class="chat-input-row">
<input type="text" id="admin-chat-input" placeholder="اكتب رسالة للطبيب...">
<button onclick="adminSendMessage('${doctorId}')">📤 إرسال</button>
</div>`;
const box=$('#admin-chat');
if(box)box.scrollTop=box.scrollHeight;
}

async function adminSendMessage(doctorId){
const input=$('#admin-chat-input');
const content=input.value.trim();
if(!content)return;
await supabaseClient.from('messages').insert({doctor_id:doctorId,sender_type:'admin',content:content,read_by_admin:true,read_by_doctor:false});
input.value='';
await openAdminChat(doctorId);
}

async function renderAdminDoctorsPage(){
const c=$('#admin-page-content');
const[p,a,r]=await Promise.all([
supabaseClient.from('doctors').select('*').eq('status','pending').eq('deleted',false),
supabaseClient.from('doctors').select('*').eq('status','approved').eq('deleted',false),
supabaseClient.from('doctors').select('*').eq('status','rejected').eq('deleted',false)
]);
const all={pending:p.data||[],approved:a.data||[],rejected:r.data||[]};
const list=all[adminFilter]||[];
c.innerHTML=`
<div class="stats-grid">
<div class="stat-card ${adminFilter==='pending'?'active':''}" onclick="setAdminFilter('pending')"><h3>قيد المراجعة</h3><p>${all.pending.length}</p></div>
<div class="stat-card ${adminFilter==='approved'?'active':''}" onclick="setAdminFilter('approved')"><h3>مقبول</h3><p>${all.approved.length}</p></div>
<div class="stat-card ${adminFilter==='rejected'?'active':''}" onclick="setAdminFilter('rejected')"><h3>مرفوض</h3><p>${all.rejected.length}</p></div>
</div>
${list.length===0?'<div class="empty-msg">لا يوجد أطباء في هذه القائمة</div>':
list.map(d=>`
<div class="pending-card">
<div style="flex-shrink:0;">
${d.image_url?`<img src="${esc(d.image_url)}" style="width:60px;height:60px;border-radius:50%;border:2px solid #F0B90B;object-fit:cover;">`:`<div style="width:60px;height:60px;border-radius:50%;border:2px solid #F0B90B;background:#0B0E11;display:flex;align-items:center;justify-content:center;font-size:1.5rem;">🩺</div>`}
</div>
<div class="info">
<h4>${esc(d.full_name)}</h4>
<p>📧 ${esc(d.email)}</p>
<p>📱 <span style="color:#F0B90B;direction:ltr;">${esc(d.phone_private||'')}</span></p>
${d.specialty?`<p>🎯 ${esc(d.specialty)}</p>`:''}
</div>
<div style="display:flex;gap:6px;flex-wrap:wrap;">
<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();viewDoctorProfile('${d.id}')">👁️ عرض/تعديل</button>
<button class="btn btn-sm btn-success" onclick="event.stopPropagation();openAdminChat('${d.id}')">💬 رسالة</button>
${d.status==='pending'?`<button class="btn btn-sm btn-success" onclick="event.stopPropagation();approveDoc('${d.id}')">✅</button><button class="btn btn-sm btn-danger" onclick="event.stopPropagation();rejectDoc('${d.id}')">❌</button>`:''}
</div>
</div>`).join('')}`;
}

function setAdminFilter(f){adminFilter=f;renderAdminDoctorsPage();}

/* ============ PWA ============ */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
e.preventDefault();
deferredPrompt=e;
if(!window.matchMedia('(display-mode: standalone)').matches)$('#installBtn').classList.remove('hidden');
});

function installApp(){
const isIOS=/iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
if(isIOS){showModal('<h3>📲 تثبيت على iPhone</h3><p>1. اضغط زر المشاركة ⬆️</p><p>2. اختر "إضافة إلى الشاشة الرئيسية"</p><p>3. اضغط "إضافة"</p>');return;}
if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(({outcome})=>{if(outcome==='accepted')$('#installBtn').classList.add('hidden');deferredPrompt=null;});return;}
showModal('<h3>📲 تثبيت التطبيق</h3><p>1. اضغط ⋮ في Chrome</p><p>2. اختر "تثبيت التطبيق"</p><p>3. اضغط "تثبيت"</p>');
}

function showModal(html){$('#modal-content').innerHTML=html;$('#installModal').classList.add('active');}
function closeModal(){$('#installModal').classList.remove('active');}

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(e=>console.log('SW:',e));}

(async function(){
$('#year').textContent=new Date().getFullYear();
await checkUser();
await route();
setInterval(refreshUnread,15000);
})();
</script>
