<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مسوق أمازون مصر - متجرك المفضل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0B0E11;
            color: #EAECEF;
            min-height: 100vh;
        }
        .header {
            background: #1E2329;
            padding: 18px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #F0B90B;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo { font-size: 28px; font-weight: 900; color: #F0B90B; }
        .logo span { color: #EAECEF; }
        .pulse-dot {
            width: 14px; height: 14px; background: #00C853; border-radius: 50%;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 0 0 rgba(0,200,83,0.7);
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0,200,83,0.7); }
            70% { transform: scale(1.2); box-shadow: 0 0 0 15px rgba(0,200,83,0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0,200,83,0); }
        }
        .live-text { color: #00C853; font-weight: 700; font-size: 14px; }
        .admin-badge a {
            color: #848E9C; text-decoration: none; font-weight: 700; font-size: 14px;
            padding: 6px 14px; border: 1px solid #2B3139; border-radius: 50px;
            transition: 0.3s;
        }
        .admin-badge a:hover { border-color: #F0B90B; color: #F0B90B; }

        .container { max-width: 1300px; margin: 0 auto; padding: 30px 20px; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        .product-card {
            background: #1E2329;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #2B3139;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(240,185,11,0.15);
            border-color: #F0B90B;
        }
        .product-card .img-wrap {
            cursor: pointer;
            background: #0B0E11;
            padding: 15px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-card .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .product-card .info {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .product-card .info h3 {
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-card .info h3:hover { color: #F0B90B; }
        .product-card .info .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .product-card .info .price {
            font-size: 22px;
            font-weight: 900;
            color: #F0B90B;
        }
        .buy-btn-small {
            background: #F0B90B;
            color: #0B0E11;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 14px;
            text-decoration: none;
            transition: 0.3s;
            display: inline-block;
            border: none;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            white-space: nowrap;
        }
        .buy-btn-small:hover { background: #FCD535; transform: scale(1.05); }

        .loading { text-align: center; padding: 80px; color: #848E9C; font-size: 22px; }

        /* صفحة التفاصيل المنبثقة */
        .detail-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(11,14,17,0.96);
            z-index: 999;
            overflow-y: auto;
            padding: 30px;
            animation: fadeIn 0.3s;
        }
        .detail-overlay.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        .detail-box {
            max-width: 1100px;
            margin: 0 auto;
            background: #1E2329;
            border-radius: 20px;
            padding: 40px;
            border: 1px solid #2B3139;
            position: relative;
        }
        .close-detail {
            position: sticky;
            top: 0;
            float: left;
            background: #F0B90B;
            border: none;
            color: #0B0E11;
            font-size: 24px;
            font-weight: 900;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            z-index: 10;
        }
        .detail-row { display: flex; flex-wrap: wrap; gap: 40px; margin-top: 20px; }
        .detail-images { flex: 1 1 350px; }
        .detail-images .main-img {
            background: #0B0E11; border-radius: 12px; padding: 20px; border: 1px solid #2B3139;
        }
        .detail-images .main-img img { width: 100%; height: 380px; object-fit: contain; }
        .detail-thumbs { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .detail-thumbs img {
            width: 70px; height: 70px; object-fit: contain;
            background: #0B0E11; border: 2px solid transparent; border-radius: 8px;
            cursor: pointer; padding: 5px;
        }
        .detail-thumbs img:hover { border-color: #F0B90B; }
        .detail-info { flex: 1 1 400px; }
        .detail-info h1 { font-size: 30px; font-weight: 900; margin-bottom: 15px; }
        .detail-info .price-big { font-size: 34px; font-weight: 900; color: #F0B90B; margin-bottom: 20px; }
        .detail-info .desc { font-size: 16px; line-height: 1.8; color: #B7BDC6; margin-bottom: 20px; }
        .detail-info ul { list-style: none; padding: 0; margin-bottom: 25px; }
        .detail-info ul li { padding: 8px 0; border-bottom: 1px solid #2B3139; display: flex; align-items: center; gap: 10px; }
        .detail-info ul li::before { content: "✦"; color: #F0B90B; font-weight: 900; }
        .buy-btn-big {
            display: inline-block;
            background: #F0B90B;
            color: #0B0E11;
            padding: 18px 50px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: 900;
            text-decoration: none;
            transition: 0.3s;
            border: none;
            width: 100%;
            text-align: center;
            max-width: 400px;
            font-family: 'Cairo', sans-serif;
        }
        .buy-btn-big:hover { background: #FCD535; transform: scale(1.03); box-shadow: 0 8px 30px rgba(240,185,11,0.3); }

        @media (max-width: 768px) {
            .header { padding: 15px; flex-direction: column; align-items: stretch; }
            .logo { font-size: 22px; }
            .detail-box { padding: 20px; }
            .detail-info h1 { font-size: 24px; }
            .detail-images .main-img img { height: 250px; }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header class="header">
        <div class="logo-area">
            <div class="logo">مسوق <span>أمازون</span> مصر</div>
            <span class="pulse-dot"></span>
            <span class="live-text">مباشر</span>
        </div>
        <div class="admin-badge">
            <a href="/login.html">🔐 دخول الأدمن</a>
        </div>
    </header>

    <!-- المحتوى -->
    <div class="container">
        <div id="productsGrid" class="products-grid">
            <div class="loading">⏳ جاري تحميل المنتجات...</div>
        </div>
    </div>

    <!-- صفحة التفاصيل -->
    <div id="detailOverlay" class="detail-overlay">
        <div class="detail-box">
            <button class="close-detail" onclick="closeDetail()">✕</button>
            <div class="detail-row">
                <div class="detail-images">
                    <div class="main-img"><img id="detailImg" src="" alt="صورة" /></div>
                    <div class="detail-thumbs" id="detailThumbs"></div>
                </div>
                <div class="detail-info">
                    <h1 id="detailTitle"></h1>
                    <div class="price-big" id="detailPrice"></div>
                    <p class="desc" id="detailDesc"></p>
                    <ul id="detailFeatures"></ul>
                    <a id="detailLink" href="#" target="_blank" class="buy-btn-big">🛒 شراء الان من أمازون مصر</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let products = [];

        // ============================
        //  جلب المنتجات من السيرفر
        // ============================
        async function fetchProducts() {
            const grid = document.getElementById('productsGrid');
            try {
                const res = await fetch('/api/products');
                products = await res.json();
                // ترتيب من الأحدث للأقدم
                products.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                renderProducts();
            } catch (e) {
                grid.innerHTML = `<div class="loading" style="color:#FF4444;">❌ حدث خطأ في تحميل المنتجات</div>`;
            }
        }

        // ============================
        //  عرض المنتجات
        // ============================
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            if (products.length === 0) {
                grid.innerHTML = `<div class="loading">🚀 لا توجد منتجات حالياً</div>`;
                return;
            }

            grid.innerHTML = products.map((p, index) => `
                <div class="product-card">
                    <div class="img-wrap" onclick="openDetail(${index})">
                        <img src="${p.images && p.images.length > 0 ? p.images[0] : 'https://via.placeholder.com/300x300/1E2329/F0B90B?text=صورة'}" alt="${p.title}" loading="lazy" />
                    </div>
                    <div class="info">
                        <h3 onclick="openDetail(${index})">${p.title}</h3>
                        <div class="price-row">
                            <span class="price">💰 ${p.price || 'راجع السعر'}</span>
                            <a href="${p.amazonLink}" target="_blank" class="buy-btn-small">🛒 شراء الآن</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ============================
        //  فتح التفاصيل
        // ============================
        function openDetail(index) {
            const p = products[index];
            if (!p) return;

            document.getElementById('detailImg').src = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/500x500/1E2329/F0B90B?text=صورة';
            document.getElementById('detailTitle').textContent = p.title;
            document.getElementById('detailPrice').textContent = p.price || 'راجع السعر على أمازون';
            document.getElementById('detailDesc').textContent = p.description || 'لا يوجد وصف';
            document.getElementById('detailLink').href = p.amazonLink || '#';

            const ul = document.getElementById('detailFeatures');
            ul.innerHTML = (p.features && p.features.length > 0) ? p.features.map(f => `<li>${f}</li>`).join('') : '<li>لا توجد مميزات</li>';

            const thumbs = document.getElementById('detailThumbs');
            const allImages = p.images || [];
            if (allImages.length > 1) {
                thumbs.innerHTML = allImages.map((img, i) => `
                    <img src="${img}" alt="صورة ${i+1}" onclick="document.getElementById('detailImg').src='${img}'" />
                `).join('');
            } else {
                thumbs.innerHTML = '';
            }

            document.getElementById('detailOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeDetail() {
            document.getElementById('detailOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // ============================
        //  بدء التشغيل
        // ============================
        window.onload = fetchProducts;
    </script>
</body>
</html>
