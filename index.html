<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#0B0E11;color:#FFF;direction:rtl;min-height:100vh;line-height:1.6}
.container{max-width:700px;margin:0 auto;padding:0 14px}
.site-header{background:#0B0E11;padding:12px 0;border-bottom:1px solid #1E2329;position:sticky;top:0;z-index:100}
.header-top-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo{font-size:1.6rem;font-weight:900;color:#F0B90B;cursor:pointer;text-shadow:0 0 20px rgba(240,185,11,0.6);user-select:none;display:flex;align-items:center;gap:6px}
.logo:hover{color:#D4A309}
.pulse-dot{display:inline-block;width:8px;height:8px;background:#0ECB81;border-radius:50%;animation:pulse 1.5s infinite}

.header-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn-header{padding:7px 14px;border-radius:20px;font-size:0.78rem;font-weight:700;border:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.btn-login{background:#F0B90B;color:#0B0E11}
.btn-register{background:transparent;color:#0ECB81;border:1px solid #0ECB81}
.btn-logout{background:transparent;color:#F6465D;border:1px solid #F6465D}
.btn-share-header{background:#1E2329;color:#F0B90B;border:1px solid #F0B90B;padding:7px 12px;border-radius:20px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn-share-header:hover{background:#F0B90B;color:#0B0E11}
.install-btn-row{width:100%;margin-top:10px;background:linear-gradient(135deg,#0ECB81,#0AB872);color:#FFF;border:none;padding:11px;border-radius:12px;font-family:inherit;font-size:0.88rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s}

.hidden{display:none!important}
.hero{padding:24px 0 16px;text-align:center}
.hero-title{font-size:1.25rem;font-weight:900;margin-bottom:4px}
.hero-title span{color:#F0B90B}
.hero-sub{color:#707A8A;font-size:0.8rem;margin-bottom:14px}
.visit-counter{display:inline-flex;align-items:center;gap:8px;background:rgba(14,203,129,0.1);color:#0ECB81;padding:7px 18px;border-radius:20px;border:1px solid #0ECB81;font-weight:800;font-size:0.85rem;margin-bottom:10px}
.visit-counter .visit-dot{width:8px;height:8px;background:#0ECB81;border-radius:50%;animation:pulse 1.5s infinite}
.share-inline-btn{display:inline-flex;align-items:center;gap:6px;background:#25D366;color:#FFF;border:none;padding:8px 20px;border-radius:20px;font-family:inherit;font-weight:800;font-size:0.82rem;cursor:pointer;margin-bottom:16px;transition:all 0.2s}
.share-inline-btn:hover{background:#128C7E;transform:translateY(-1px)}
.search-box{background:#1E2329;border:1px solid #2B3139;border-radius:40px;padding:4px;display:flex;max-width:480px;margin:0 auto}
.search-box input{flex:1;border:none;outline:none;padding:10px 18px;background:transparent;color:#FFF;font-family:inherit;font-size:0.88rem}
.search-box button{background:#F0B90B;color:#0B0E11;border:none;padding:9px 20px;border-radius:30px;cursor:pointer;font-weight:800;font-family:inherit;font-size:0.82rem}
.section-header{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;padding-bottom:8px;border-bottom:1px solid #1E2329}
.section-header h2{color:#F0B90B;font-size:0.95rem;font-weight:900}
.count-badge{background:#F0B90B;color:#0B0E11;font-size:0.7rem;font-weight:900;padding:2px 9px;border-radius:20px}
.doctors-list{display:flex;flex-direction:column;gap:12px}
.doc-card{background:#1E2329;border:1px solid #2B3139;border-radius:16px;padding:16px;display:grid;grid-template-columns:100px 1fr 20px;gap:14px;cursor:pointer;align-items:center;transition:all 0.2s}
.doc-card:hover{border-color:#F0B90B;background:#232830}
.doc-avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #F0B90B}
.doc-avatar-ph{width:100px;height:100px;border-radius:50%;border:3px solid #F0B90B;background:#0B0E11;display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.doc-info{display:flex;flex-direction:column;gap:5px;min-width:0}
.doc-name{font-size:1.05rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-spec{color:#F0B90B;font-weight:700;font-size:0.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-loc{color:#B7BDC6;font-size:0.78rem}
.doc-arrow{color:#F0B90B;opacity:0.5}
.empty-msg{text-align:center;padding:40px 20px;background:#1E2329;border:1px dashed #2B3139;border-radius:14px;color:#707A8A;font-size:0.9rem}
.form-container{max-width:520px;margin:30px auto;background:#1E2329;border-radius:16px;border:1px solid #2B3139;padding:24px}
.form-container h2{color:#F0B90B;text-align:center;margin-bottom:6px;font-weight:900}
.form-subtitle{text-align:center;color:#707A8A;font-size:0.85rem;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:0.88rem}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:12px;background:#0B0E11;border:1px solid #2B3139;border-radius:10px;color:#FFF;font-family:inherit;font-size:0.9rem;outline:none}
.form-group input:focus,.form-group textarea:focus{border-color:#F0B90B}
.form-group textarea{min-height:80px;resize:vertical}
.form-group small{color:#707A8A;font-size:0.75rem;display:block;margin-top:4px}
.days-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px}
.day-chip{padding:10px 8px;background:#0B0E11;border:2px solid #2B3139;border-radius:12px;color:#B7BDC6;cursor:pointer;font-family:inherit;font-weight:700;font-size:0.82rem;text-align:center;user-select:none;position:relative}
.day-chip.selected{background:#F0B90B;color:#0B0E11;border-color:#F0B90B}

.time-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.time-box{background:#0B0E11;border:2px solid #2B3139;border-radius:14px;padding:12px}
.time-label{color:#707A8A;font-size:0.75rem;font-weight:600;margin-bottom:8px;display:block;text-align:center}
.time-main-input{padding:6px;border:none;background:transparent;font-size:1.2rem;font-weight:900;color:#F0B90B;text-align:center;width:100%;letter-spacing:1px;font-family:inherit;outline:none}
.ampm-group{display:flex;gap:6px;justify-content:center;margin-top:10px}
.ampm-btn{padding:7px 16px;border-radius:10px;background:#1E2329;border:1px solid #2B3139;color:#707A8A;font-family:inherit;font-weight:700;font-size:0.78rem;cursor:pointer}
.ampm-btn.active{background:#F0B90B;color:#0B0E11;border-color:#F0B90B}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:30px;font-weight:800;cursor:pointer;border:none;font-family:inherit;font-size:0.9rem;width:100%}
.btn-primary{background:#F0B90B;color:#0B0E11}
.btn-success{background:#0ECB81;color:#FFF}
.btn-danger{background:#F6465D;color:#FFF}
.btn-sm{padding:6px 12px;font-size:0.75rem;width:auto}
.alert{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-weight:600;font-size:0.88rem;text-align:center}
.alert-success{background:rgba(14,203,129,0.15);color:#0ECB81;border:1px solid #0ECB81}
.alert-danger{background:rgba(246,70,93,0.15);color:#F6465D;border:1px solid #F6465D}
.doctor-full-page{max-width:700px;margin:20px auto;background:#1E2329;border:1px solid #2B3139;border-radius:16px;overflow:hidden}
.dfp-hero{background:#232830;padding:30px 20px;text-align:center;border-bottom:1px solid #2B3139}
.dfp-avatar{width:130px;height:130px;border-radius:50%;border:4px solid #F0B90B;object-fit:cover;margin:0 auto 15px;display:block}
.dfp-avatar-ph{width:130px;height:130px;border-radius:50%;border:4px solid #F0B90B;background:#0B0E11;display:flex;align-items:center;justify-content:center;font-size:3.5rem;margin:0 auto 15px}
.dfp-hero h1{color:#F0B90B;font-size:1.5rem;font-weight:900;margin-bottom:6px}
.dfp-spec{font-weight:700;margin-bottom:4px}
.dfp-sub{color:#707A8A;font-size:0.85rem;margin-bottom:16px}
.dfp-call{display:inline-block;background:#0ECB81;color:#FFF;padding:12px 30px;border-radius:30px;font-weight:800;text-decoration:none}
.dfp-body{padding:18px}
.dfp-card{background:#0B0E11;border:1px solid #2B3139;border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.dfp-icon{font-size:1.4rem;width:40px;height:40px;background:#1E2329;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dfp-label{color:#707A8A;font-size:0.75rem}
.dfp-value{font-weight:600;font-size:0.9rem}
.dfp-section{background:#0B0E11;border:1px solid #2B3139;border-radius:10px;padding:16px;margin-bottom:10px}
.dfp-section h3{color:#F0B90B;font-size:0.95rem;margin-bottom:10px}
.dfp-section p{font-size:0.88rem;line-height:1.8}
.days-display{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.day-badge{background:rgba(240,185,11,0.15);color:#F0B90B;padding:4px 12px;border-radius:20px;font-size:0.78rem;font-weight:700;border:1px solid rgba(240,185,11,0.3)}
.hours-display{display:inline-flex;align-items:center;gap:8px;background:rgba(14,203,129,0.15);color:#0ECB81;padding:8px 16px;border-radius:12px;font-size:0.85rem;font-weight:800;border:1px solid #0ECB81;margin-top:10px;width:100%}
.dfp-back{display:block;text-align:center;background:transparent;border:1px solid #2B3139;color:#FFF;padding:12px;border-radius:10px;font-weight:700;margin-top:16px;cursor:pointer;width:100%;font-family:inherit;font-size:0.9rem}
.dash-container{max-width:720px;margin:20px auto;padding:0 16px}
.dash-header{background:#1E2329;border:1px solid #2B3139;border-radius:12px;padding:20px;display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.form-section{background:#1E2329;border:1px solid #2B3139;border-radius:12px;padding:18px;margin-bottom:16px}
.form-section h3{color:#F0B90B;font-size:1rem;margin-bottom:14px;border-bottom:1px solid #2B3139;padding-bottom:10px}
.status-badge{padding:6px 14px;border-radius:20px;font-weight:700;font-size:0.82rem}
.status-pending{background:rgba(240,185,11,0.15);color:#F0B90B;border:1px solid #F0B90B}
.status-approved{background:rgba(14,203,129,0.15);color:#0ECB81;border:1px solid #0ECB81}
.status-rejected{background:rgba(246,70,93,0.15);color:#F6465D;border:1px solid #F6465D}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.stat-card{background:#1E2329;border:1px solid #2B3139;border-radius:12px;padding:16px;text-align:center;cursor:pointer}
.stat-card.active{border-color:#F0B90B}
.stat-card h3{color:#707A8A;font-size:0.8rem;margin-bottom:4px}
.stat-card p{font-size:1.6rem;font-weight:900;color:#F0B90B}
.pending-card{background:#1E2329;border:1px solid #2B3139;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pending-card .info{flex:1;min-width:150px}
.pending-card .info h4{font-size:0.95rem;margin-bottom:4px}
.pending-card .info p{color:#707A8A;font-size:0.78rem}
.tabs{display:flex;gap:6px;margin:20px 0;overflow-x:auto;padding-bottom:4px}
.tab{padding:10px 18px;border-radius:20px;background:#1E2329;border:1px solid #2B3139;color:#FFF;cursor:pointer;font-family:inherit;font-weight:700;font-size:0.82rem;white-space:nowrap}

.tab-add{background:#0ECB81;color:#FFF;border-color:#0ECB81}
.tab-add.active{background:#0ECB81;color:#FFF;border-color:#0ECB81}
.site-footer{text-align:center;padding:20px;color:#707A8A;border-top:1px solid #1E2329;margin-top:24px;font-size:0.75rem}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-box{background:#1E2329;border:1px solid #2B3139;border-radius:16px;padding:24px;max-width:400px;text-align:center;position:relative;width:100%}
.modal-box h3{color:#F0B90B;font-size:1.1rem;margin-bottom:14px}
.modal-box p{color:#B7BDC6;font-size:0.88rem;line-height:1.8;margin-bottom:8px}
.close-x{position:absolute;top:10px;left:14px;background:transparent;border:none;color:#707A8A;font-size:1.5rem;cursor:pointer}
.loading{text-align:center;padding:40px;color:#F0B90B}
.img-preview{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #F0B90B;margin:0 auto 10px;display:block}
.img-preview-placeholder{width:120px;height:120px;border-radius:50%;background:#0B0E11;border:3px dashed #2B3139;display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:#4a5560;margin:0 auto 10px}
.file-input-label{display:block;background:#0B0E11;border:2px dashed #2B3139;border-radius:12px;padding:16px;text-align:center;cursor:pointer;color:#707A8A;font-size:0.9rem;font-weight:700}
.file-input-label input{display:none}
.image-upload-section{text-align:center;margin-bottom:16px;padding:16px;background:#0B0E11;border-radius:12px;border:1px solid #2B3139}
.center-toggle{width:100%;background:transparent;border:1px solid #2B3139;color:#F0B90B;padding:14px;border-radius:12px;font-family:inherit;font-weight:800;font-size:0.92rem;cursor:pointer;margin-bottom:10px}
.center-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.center-btn{padding:10px 8px;background:#0B0E11;border:1px solid #2B3139;border-radius:12px;color:#FFF;cursor:pointer;font-family:inherit;font-weight:700;font-size:0.78rem;text-align:center}
.center-btn.active{background:#F0B90B;color:#0B0E11;border-color:#F0B90B}
.support-btn{background:#25D366;color:#FFF;border-color:#25D366}
.add-hero{background:rgba(14,203,129,0.1);border:2px solid #0ECB81;border-radius:16px;padding:20px;text-align:center;margin-bottom:20px}
.add-hero h2{color:#0ECB81;font-size:1.2rem;font-weight:900;margin-bottom:6px}
.add-hero p{color:#B7BDC6;font-size:0.85rem}
@media (max-width:500px){
.logo{font-size:1.35rem}
.doc-card{grid-template-columns:90px 1fr 16px;padding:14px;gap:12px}
.doc-avatar,.doc-avatar-ph{width:90px;height:90px;font-size:2.1rem}
.doc-name{font-size:0.98rem}
.stats-grid{grid-template-columns:1fr 1fr}
.days-grid{grid-template-columns:repeat(3,1fr)}
.time-row{grid-template-columns:1fr}
.btn-header{padding:6px 10px;font-size:0.72rem}
}
</style>
</head>

<div id="splash-prayer" style="position:fixed;inset:0;background:rgba(11,14,17,0.95);z-index:99999;display:flex;align-items:center;justify-content:center;">
<div style="width:200px;height:200px;border-radius:50%;background:#1E2329;border:3px solid #F0B90B;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:prayerPulse 1s infinite;">
<div style="font-size:2.2rem;color:#F0B90B;line-height:1;margin-bottom:6px;">ﷺ</div>
<h2 style="color:#F0B90B;font-size:1.05rem;font-weight:900;margin-bottom:2px;">صلي على النبي</h2>
<p style="color:#0ECB81;font-size:0.72rem;font-weight:600;">صلى الله عليه وسلم</p>
</div>
</div>

<script>
setTimeout(function(){
  var s = document.getElementById('splash-prayer');
  if(s){
    s.style.transition = 'opacity 0.4s ease';
    s.style.opacity = '0';
    setTimeout(function(){ if(s && s.parentNode) s.parentNode.removeChild(s); }, 500);
  }
}, 1000);
</script>

}

  if (s.indexOf('صباح') !== -1) period = 'صباحاً';
  else if (s.indexOf('مساء') !== -1) period = 'مساءً';
  var hour = s.replace(/\s*(صباحاً|مساءً|صباحا|مساء|صباح|مساء|ص|م)\s*$/g, '').trim();
  return { hour: hour, period: period };
}
function buildTimeValue(hour, period) {
  hour = (hour || '').trim();
  if (!hour) return '';
  return period ? (hour + ' ' + period) : hour;
}
function formatTimeDisplay(val) {
  var p = parseTimeValue(val);
  if (!p.hour) return '';
  if (p.period) return p.hour + ' ' + p.period;
  var parts = p.hour.split(':');
  if (parts.length >= 2) {
    var h = parseInt(parts[0], 10);
    if (!isNaN(h)) {
      var period2 = h >= 12 ? 'مساءً' : 'صباحاً';
      h = h % 12 || 12;
      return h + ':' + parts[1] + ' ' + period2;
    }
  }
  return p.hour;
}
function formatTimeRange(start, end) {
  if (!start || !end) return '';
  return 'من ' + formatTimeDisplay(start) + ' إلى ' + formatTimeDisplay(end);
}
function autoFormatHour(input) {
  if (!input) return;
  var val = input.value.trim();
  if (!val) return;
  var map = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9' };
  val = val.replace(/[٠-٩]/g, function(d){ return map[d]; }).replace(/\s/g, '');
  var match = val.match(/^(\d{1,2})(?::(\d{0,2}))?$/);
  if (match) {
    var h = parseInt(match[1], 10);
    var m = match[2] || '';
    if (h > 23) h = 23;
    if (m.length === 0) m = '00';
    else if (m.length === 1) m = '0' + m;
    else if (parseInt(m, 10) > 59) m = '59';
    input.value = (h < 10 ? '0' + h : '' + h) + ':' + m;
  }
}
function setAmPm(btn, inputId, value) {
  var input = byId(inputId);
  if (!input) return;
  var group = btn.parentNode;
  if (group) {
    var btns = group.querySelectorAll('.ampm-btn');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  }
  btn.classList.add('active');
  var hiddenId = inputId + '_period';
  var hidden = byId(hiddenId);
  if (!hidden) {
    hidden = document.createElement('input');
    hidden.type = 'hidden';
    hidden.id = hiddenId;
    hidden.name = hiddenId;
    input.parentNode.appendChild(hidden);
  }
  hidden.value = value;
}
function initAmPmHidden(inputId, period) {
  var input = byId(inputId);
  if (!input) return;
  var hiddenId = inputId + '_period';
  if (!byId(hiddenId)) {
    var h = document.createElement('input');
    h.type = 'hidden';
    h.id = hiddenId;
    h.name = hiddenId;
    input.parentNode.appendChild(h);
  }
  byId(hiddenId).value = period || '';
}
function buildAmPmButtons(inputId, currentPeriod) {
  var p1 = currentPeriod === 'صباحاً' ? ' active' : '';
  var p2 = currentPeriod === 'مساءً' ? ' active' : '';
  return '<div class="ampm-group">' +

    '<button type="button" class="ampm-btn' + p2 + '" onclick="setAmPm(this,\'' + inputId + '\',\'مساءً\')">مساءً</button>' +
  '</div>';
}

async function loadVisitCounter() {
  try {
    if (!supabaseClient) return;
    var counted = sessionStorage.getItem('visit_counted');
    var newCount = null;
    if (!counted) {
      try {
        var r = await supabaseClient.rpc('increment_visits');
        if (!r.error && r.data !== null && r.data !== undefined) {
          newCount = r.data;
          sessionStorage.setItem('visit_counted', '1');
        }
      } catch (e) {}
    }
    if (newCount === null) {
      var r2 = await supabaseClient.from('site_stats').select('total_visits').eq('id', 1).maybeSingle();
      if (!r2.error && r2.data) newCount = r2.data.total_visits;
    }
    var el = byId('visits-number');
    if (newCount !== null && el) {
      animateNumber(el, newCount);
    } else if (el && el.parentElement) {
      el.parentElement.style.display = 'none';
    }
  } catch (e) {}
}

function animateNumber(el, target) {
  var start = Math.max(0, target - 20);
  var duration = 1200;
  var t0 = performance.now();
  function tick(now) {
    var elapsed = now - t0;
    var p = Math.min(elapsed / duration, 1);
    var eased = 1 - Math.pow(1 - p, 3);
    var current = Math.floor(start + (target - start) * eased);
    el.textContent = current.toLocaleString('en-US');
    if (p < 1) requestAnimationFrame(tick);
    else el.textContent = target.toLocaleString('en-US');
  }
  requestAnimationFrame(tick);
}

function previewImage(input) {
  if (input.files && input.files[0]) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var ph = byId('current-img-ph');
      if (ph) ph.style.display = 'none';
      var preview = byId('current-img');
      if (preview) {
        preview.src = e.target.result;
      } else {
        preview = document.createElement('img');
        preview.id = 'current-img';
        preview.className = 'img-preview';
        preview.src = e.target.result;
        var section = input.closest('.image-upload-section');
        if (section) {
          var lbl = section.querySelector('.file-input-label');
          if (lbl) section.insertBefore(preview, lbl);
        }
      }
    };
    reader.readAsDataURL(input.files[0]);
  }
}

async function saveDoctor(f) {
  var al = byId('dash-alert');
  al.innerHTML = '<div class="loading">⏳ جارٍ الحفظ...</div>';
  var selectedDays = getSelectedDays('days-grid');
  if (selectedDays.length === 0) {
    showAlert(al, '⚠️ يرجى اختيار يوم عمل واحد على الأقل');
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  var imageUrl = currentDoctor.image_url || '';
  var fileInput = f.image_file;
  if (fileInput && fileInput.files && fileInput.files[0]) {
    var file = fileInput.files[0];
    var ext = file.name.split('.').pop().toLowerCase();
    var fileName = 'doctor_' + currentUser.id + '_' + Date.now() + '.' + ext;
    var up = await supabaseClient.storage.from('doctor-images').upload(fileName, file, { contentType: file.type, upsert: true });
    if (up.error) { showAlert(al, 'خطأ رفع الصورة: ' + up.error.message); return; }
    var u = supabaseClient.storage.from('doctor-images').getPublicUrl(fileName);
    imageUrl = u.data.publicUrl;
  }
  var startHour = (byId('work_start_input') || {}).value || '';
  var startPeriod = (byId('work_start_input_period') || {}).value || '';
  var endHour = (byId('work_end_input') || {}).value || '';
  var endPeriod = (byId('work_end_input_period') || {}).value || '';

  var upd = {
    full_name: (f.full_name ? f.full_name.value.trim() : ''),
    specialty: (f.specialty ? f.specialty.value.trim() : ''),
    sub_specialty: (f.sub_specialty ? f.sub_specialty.value.trim() : ''),
    phone1: (f.phone1 ? f.phone1.value.trim() : ''),
    phone2: (f.phone2 ? f.phone2.value.trim() : ''),
    governorate: (f.governorate ? f.governorate.value.trim() : ''),
    city: (f.city ? f.city.value.trim() : ''),
    address: (f.address ? f.address.value.trim() : ''),
    work_days: selectedDays.join(','),
    work_start: buildTimeValue(startHour, startPeriod),
    work_end: buildTimeValue(endHour, endPeriod),
    qualifications: (f.qualifications ? f.qualifications.value.trim() : ''),
    certificates: (f.certificates ? f.certificates.value.trim() : ''),
    experience: (f.experience ? f.experience.value.trim() : ''),
    about: (f.about ? f.about.value.trim() : ''),
    image_url: imageUrl,
    status: 'pending'
  };
  var r = await supabaseClient.from('doctors').update(upd).eq('user_id', currentUser.id);
  if (r.error) { showAlert(al, 'خطأ: ' + r.error.message); return; }
  for (var k in upd) currentDoctor[k] = upd[k];
  showAlert(al, '✅ تم حفظ بياناتك بنجاح! حسابك الآن قيد المراجعة.', 'success');
  window.scrollTo({top:0, behavior:'smooth'});
}

function previewEditImage(input) {
  if (input.files && input.files[0]) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var ph = byId('edit-current-img-ph');
      if (ph) ph.style.display = 'none';
      var img = byId('edit-current-img');
      if (img) {
        img.src = e.target.result;
      } else {
        img = document.createElement('img');
        img.id = 'edit-current-img';
        img.className = 'img-preview';
        img.src = e.target.result;
        var sec = input.closest('.image-upload-section');
        if (sec) {
          var lbl = sec.querySelector('.file-input-label');
          if (lbl) sec.insertBefore(img, lbl);
        }
      }
    };
    reader.readAsDataURL(input.files[0]);
  }
}

async function adminSaveDoctor(f, id) {
  var al = byId('edit-alert');
  if (al) al.innerHTML = '<div class="loading">⏳ جارٍ الحفظ...</div>';
  var selectedDays = getSelectedDays('admin-days-grid');
  var imageUrl = null;
  var fileInput = f.edit_image_file;
  if (fileInput && fileInput.files && fileInput.files[0]) {
    var file = fileInput.files[0];
    var ext = file.name.split('.').pop().toLowerCase();
    var fileName = 'admin_edit_' + id + '_' + Date.now() + '.' + ext;
    var up = await supabaseClient.storage.from('doctor-images').upload(fileName, file, { contentType: file.type, upsert: true });
    if (up.error) { showAlert(al, 'خطأ رفع الصورة: ' + up.error.message); return; }
    var u = supabaseClient.storage.from('doctor-images').getPublicUrl(fileName);
    imageUrl = u.data.publicUrl;
  }
  var startHour = (byId('e_work_start_input') || {}).value || '';
  var startPeriod = (byId('e_work_start_input_period') || {}).value || '';
  var endHour = (byId('e_work_end_input') || {}).value || '';
  var endPeriod = (byId('e_work_end_input_period') || {}).value || '';

  var upd = {
    full_name: (byId('e_full_name') ? byId('e_full_name').value.trim() : ''),
    phone_private: (byId('e_phone_private') ? byId('e_phone_private').value.trim() : ''),
    specialty: (byId('e_specialty') ? byId('e_specialty').value.trim() : ''),
    sub_specialty: (byId('e_sub_specialty') ? byId('e_sub_specialty').value.trim() : ''),
    phone1: (byId('e_phone1') ? byId('e_phone1').value.trim() : ''),
    phone2: (byId('e_phone2') ? byId('e_phone2').value.trim() : ''),
    governorate: (byId('e_governorate') ? byId('e_governorate').value.trim() : ''),
    city: (byId('e_city') ? byId('e_city').value.trim() : ''),
    address: (byId('e_address') ? byId('e_address').value.trim() : ''),
    work_days: selectedDays.join(','),
    work_start: buildTimeValue(startHour, startPeriod),
    work_end: buildTimeValue(endHour, endPeriod),
    qualifications: (byId('e_qualifications') ? byId('e_qualifications').value.trim() : ''),
    certificates: (byId('e_certificates') ? byId('e_certificates').value.trim() : ''),
    experience: (byId('e_experience') ? byId('e_experience').value.trim() : ''),
    about: (byId('e_about') ? byId('e_about').value.trim() : '')
  };
  if (imageUrl) upd.image_url = imageUrl;
  var r = await supabaseClient.from('doctors').update(upd).eq('id', id);
  if (r.error) { showAlert(al, 'خطأ: ' + r.error.message); return; }
  showAlert(al, '✅ تم حفظ التعديلات بنجاح', 'success');
  window.scrollTo({top:0, behavior:'smooth'});
}

async function renderAdminDoctorsPage() {
  var c = byId('admin-page-content');
  var res = await Promise.all([
    supabaseClient.from('doctors').select('*').eq('status', 'pending').eq('deleted', false),
    supabaseClient.from('doctors').select('*').eq('status', 'approved').eq('deleted', false),
    supabaseClient.from('doctors').select('*').eq('status', 'rejected').eq('deleted', false)
  ]);
  var all = { pending: res[0].data || [], approved: res[1].data || [], rejected: res[2].data || [] };
  var list = all[adminFilter] || [];
  var html = '<div class="stats-grid">' +
    '<div class="stat-card' + (adminFilter === 'pending' ? ' active' : '') + '" onclick="setAdminFilter(\'pending\')"><h3>⏳ قيد المراجعة</h3><p>' + all.pending.length + '</p></div>' +
    '<div class="stat-card' + (adminFilter === 'approved' ? ' active' : '') + '" onclick="setAdminFilter(\'approved\')"><h3>✅ مقبول</h3><p>' + all.approved.length + '</p></div>' +
    '<div class="stat-card' + (adminFilter === 'rejected' ? ' active' : '') + '" onclick="setAdminFilter(\'rejected\')"><h3>❌ مرفوض</h3><p>' + all.rejected.length + '</p></div>' +
  '</div>';

  if (list.length === 0) {
    html += '<div class="empty-msg">📭 لا يوجد أطباء في هذه القائمة</div>';
  } else {
    for (var i = 0; i < list.length; i++) {
      var d = list[i];
      var days = parseDays(d.work_days);
      var timeRange = formatTimeRange(d.work_start, d.work_end);
      html += '<div class="pending-card">' +
        '<div style="flex-shrink:0;">' + (d.image_url ? '<img src="' + esc(d.image_url) + '" style="width:60px;height:60px;border-radius:50%;border:2px solid #F0B90B;object-fit:cover;">' : '<div style="width:60px;height:60px;border-radius:50%;border:2px solid #F0B90B;background:#0B0E11;display:flex;align-items:center;justify-content:center;font-size:1.5rem;">🩺</div>') + '</div>' +
        '<div class="info">' +
          '<h4>' + esc(d.full_name) + '</h4>' +
          '<p>📧 ' + esc(d.email) + '</p>' +
          '<p>📱 <span style="color:#F0B90B;direction:ltr;">' + esc(d.phone_private || '') + '</span></p>' +
          (d.specialty ? '<p>🎯 ' + esc(d.specialty) + '</p>' : '') +
          (days.length > 0 ? '<p style="color:#0ECB81;">🗓️ ' + esc(days.join(' • ')) + '</p>' : '') +
          (timeRange ? '<p style="color:#F0B90B;">⏰ ' + esc(timeRange) + '</p>' : '') +
        '</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
          '<button class="btn btn-sm btn-primary" onclick="viewDoctorProfile(\'' + d.id + '\')">👁️ عرض/تعديل</button>' +
        '</div>' +
      '</div>';
    }
  }
  c.innerHTML = html;
}

function setAdminFilter(f) { adminFilter = f; renderAdminDoctorsPage(); }

/* ============ 14) Router ============ */
async function route() {
  var hash = window.location.hash.slice(1) || 'home';
  var parts = hash.split('/');
  var page = parts[0];
  var param = parts[1];
  var app = byId('app');
  if (!app) return;
  app.innerHTML = '<div class="loading">⏳ جارٍ التحميل...</div>';
  try {
    if (page === 'home') await renderHome(app);
    else if (page === 'doctor') await renderDoctor(app, param);
    else if (page === 'login') renderLogin(app);
    else if (page === 'register') renderRegister(app);
    else if (page === 'doctor-dashboard') await renderDoctorDashboard(app);
    else if (page === 'admin') await renderAdmin(app);
    else await renderHome(app);
  } catch (e) {
    console.error('Route error:', e);
    app.innerHTML = '<div class="container"><div class="alert alert-danger">خطأ: ' + esc(e.message || 'unknown') + '</div></div>';
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', route);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function(e){ console.log('SW:', e); });
}

document.addEventListener('DOMContentLoaded', function() {
  var y = byId('year');
  if (y) y.textContent = new Date().getFullYear();
});

window.addEventListener('load', async function() {
  try {
    await checkUser();
    await route();
  } catch (e) {
    console.error('Init error:', e);
    var app = byId('app');
    if (app) app.innerHTML = '<div class="container"><div class="alert alert-danger">خطأ في تحميل الصفحة</div></div>';
  }
});
