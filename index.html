<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#0B0E11;color:#FFF;direction:rtl;min-height:100vh;line-height:1.6}
.container{max-width:700px;margin:0 auto;padding:0 14px}
.site-header{background:rgba(11,14,17,0.98);backdrop-filter:blur(10px);padding:12px 0 10px;border-bottom:1px solid #1E2329;position:sticky;top:0;z-index:100}

.header-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn-header{padding:7px 14px;border-radius:20px;font-size:0.78rem;font-weight:700;border:none;cursor:pointer;font-family:inherit;position:relative}
.btn-login{background:#F0B90B;color:#0B0E11}
.btn-register{background:transparent;color:#0ECB81;border:1px solid #0ECB81}
.btn-logout{background:transparent;color:#F6465D;border:1px solid #F6465D}
.install-btn-row{width:100%;margin-top:10px;background:linear-gradient(135deg,#0ECB81,#0AB872);color:#FFF;border:none;padding:11px;border-radius:12px;font-family:inherit;font-size:0.88rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.hidden{display:none!important}
.hero{padding:24px 0 16px;text-align:center}

.hero-sub{color:#707A8A;font-size:0.8rem;margin-bottom:14px}
.visit-counter{display:inline-flex;align-items:center;gap:8px;background:rgba(14,203,129,0.1);color:#0ECB81;padding:7px 18px;border-radius:20px;border:1px solid rgba(14,203,129,0.35);font-weight:800;font-size:0.85rem;margin-bottom:14px;box-shadow:0 0 15px rgba(14,203,129,0.15)}

.search-box{background:#1E2329;border:1px solid #2B3139;border-radius:40px;padding:4px;display:flex;max-width:480px;margin:0 auto}
.search-box input{flex:1;border:none;outline:none;padding:10px 18px;background:transparent;color:#FFF;font-family:inherit;font-size:0.88rem}
.search-box button{background:#F0B90B;color:#0B0E11;border:none;padding:9px 20px;border-radius:30px;cursor:pointer;font-weight:800;font-family:inherit;font-size:0.82rem}
.section-header{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;padding-bottom:8px;border-bottom:1px solid #1E2329}
.section-header h2{color:#F0B90B;font-size:0.95rem;font-weight:900}
.count-badge{background:#F0B90B;color:#0B0E11;font-size:0.7rem;font-weight:900;padding:2px 9px;border-radius:20px}
.doctors-list{display:flex;flex-direction:column;gap:12px}
.doc-card{background:#1E2329;border:1px solid #2B3139;border-radius:16px;padding:16px;display:grid;grid-template-columns:100px 1fr 20px;gap:14px;cursor:pointer;align-items:center;transition:all 0.2s}
.doc-card:hover{border-color:#F0B90B;background:#232830;transform:translateY(-2px)}
.doc-avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #F0B90B}
.doc-avatar-ph{width:100px;height:100px;border-radius:50%;border:3px solid #F0B90B;background:#0B0E11;display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.doc-info{display:flex;flex-direction:column;gap:5px;min-width:0}
.doc-name{font-size:1.05rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-spec{color:#F0B90B;font-weight:700;font-size:0.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-loc{color:#B7BDC6;font-size:0.78rem}
.doc-arrow{color:#F0B90B;opacity:0.5}
.empty-msg{text-align:center;padding:40px 20px;background:#1E2329;border:1px dashed #2B3139;border-radius:14px;color:#707A8A;font-size:0.9rem}
.form-container{max-width:520px;margin:30px auto;background:#1E2329;border-radius:16px;border:1px solid #2B3139;padding:24px}

.form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:0.88rem}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:12px;background:#0B0E11;border:1px solid #2B3139;border-radius:10px;color:#FFF;font-family:inherit;font-size:0.9rem;outline:none}

.days-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px}
.day-chip{padding:10px 8px;background:#0B0E11;border:2px solid #2B3139;border-radius:12px;color:#B7BDC6;cursor:pointer;font-family:inherit;font-weight:700;font-size:0.82rem;transition:all 0.2s;text-align:center;user-select:none;position:relative}
.day-chip:hover{border-color:#F0B90B}
.day-chip.selected{background:linear-gradient(135deg,#F0B90B,#D4A309);color:#0B0E11;border-color:#F0B90B;box-shadow:0 4px 12px rgba(240,185,11,0.3)}
.day-chip .check{position:absolute;top:4px;left:6px;font-size:0.7rem;opacity:0;transition:opacity 0.2s}
.day-chip.selected .check{opacity:1}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.time-box{background:#0B0E11;border:2px solid #2B3139;border-radius:14px;padding:12px;text-align:center;transition:all 0.2s}

.time-box .time-label{color:#707A8A;font-size:0.72rem;font-weight:600;margin-bottom:6px;display:block}
.time-box .time-icon{font-size:1rem;margin-left:4px}
.time-main-input{padding:6px;border:none;background:transparent;font-size:1.1rem;font-weight:900;color:#F0B90B;text-align:center;width:100%;letter-spacing:1px;font-family:'Tajawal',sans-serif;outline:none}
.time-main-input::placeholder{color:#4a5560;font-weight:500;font-size:0.9rem}
.ampm-group{display:flex;gap:6px;justify-content:center;margin-top:8px}
.ampm-btn{padding:6px 14px;border-radius:10px;background:#1E2329;border:1px solid #2B3139;color:#707A8A;font-family:inherit;font-weight:700;font-size:0.78rem;cursor:pointer;transition:all 0.2s}
.ampm-btn:hover{border-color:#F0B90B;color:#F0B90B}
.ampm-btn.active{background:linear-gradient(135deg,#F0B90B,#D4A309);color:#0B0E11;border-color:#F0B90B;box-shadow:0 2px 8px rgba(240,185,11,0.3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:30px;font-weight:800;cursor:pointer;border:none;font-family:inherit;font-size:0.9rem;width:100%;transition:all 0.2s}
.btn-primary{background:#F0B90B;color:#0B0E11}
.btn-success{background:#0ECB81;color:#FFF}
.btn-danger{background:#F6465D;color:#FFF}
.btn-sm{padding:6px 12px;font-size:0.75rem;width:auto}
.alert{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-weight:600;font-size:0.88rem;text-align:center}
.alert-success{background:rgba(14,203,129,0.15);color:#0ECB81;border:1px solid #0ECB81}
.alert-danger{background:rgba(246,70,93,0.15);color:#F6465D;border:1px solid #F6465D}
.doctor-full-page{max-width:700px;margin:20px auto;background:#1E2329;border:1px solid #2B3139;border-radius:16px;overflow:hidden}
.dfp-hero{background:linear-gradient(135deg,#1E2329,#232830);padding:30px 20px;text-align:center;border-bottom:1px solid #2B3139}
.dfp-avatar{width:130px;height:130px;border-radius:50%;border:4px solid #F0B90B;object-fit:cover;margin:0 auto 15px;display:block;box-shadow:0 0 25px rgba(240,185,11,0.4)}
.dfp-avatar-ph{width:130px;height:130px;border-radius:50%;border:4px solid #F0B90B;background:#0B0E11;display:flex;align-items:center;justify-content:center;font-size:3.5rem;margin:0 auto 15px}
.dfp-hero h1{color:#F0B90B;font-size:1.5rem;font-weight:900;margin-bottom:6px}
.dfp-spec{font-weight:700;margin-bottom:4px}
.dfp-sub{color:#707A8A;font-size:0.85rem;margin-bottom:16px}
.dfp-call{display:inline-block;background:#0ECB81;color:#FFF;padding:12px 30px;border-radius:30px;font-weight:800;text-decoration:none}
.dfp-body{padding:18px}
.dfp-card{background:#0B0E11;border:1px solid #2B3139;border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.dfp-icon{font-size:1.4rem;width:40px;height:40px;background:#1E2329;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dfp-label{color:#707A8A;font-size:0.75rem}
.dfp-value{font-weight:600;font-size:0.9rem}
.dfp-section{background:#0B0E11;border:1px solid #2B3139;border-radius:10px;padding:16px;margin-bottom:10px}
.dfp-section h3{color:#F0B90B;font-size:0.95rem;margin-bottom:10px}
.dfp-section p{font-size:0.88rem;line-height:1.8}
.days-display{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.day-badge{background:rgba(240,185,11,0.15);color:#F0B90B;padding:4px 12px;border-radius:20px;font-size:0.78rem;font-weight:700;border:1px solid rgba(240,185,11,0.3)}
.hours-display{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(14,203,129,0.15),rgba(14,203,129,0.08));color:#0ECB81;padding:8px 16px;border-radius:12px;font-size:0.85rem;font-weight:800;border:1px solid rgba(14,203,129,0.35);margin-top:10px;width:100%}
.hours-display .clock-icon{font-size:1rem}
.hours-display .time-range{color:#FFF;font-weight:700}
.dfp-back{display:block;text-align:center;background:transparent;border:1px solid #2B3139;color:#FFF;padding:12px;border-radius:10px;font-weight:700;margin-top:16px;cursor:pointer;width:100%;font-family:inherit;font-size:0.9rem}
.dash-container{max-width:720px;margin:20px auto;padding:0 16px}
.dash-header{background:#1E2329;border:1px solid #2B3139;border-radius:12px;padding:20px;display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.form-section{background:#1E2329;border:1px solid #2B3139;border-radius:12px;padding:18px;margin-bottom:16px}
.form-section h3{color:#F0B90B;font-size:1rem;margin-bottom:14px;border-bottom:1px solid #2B3139;padding-bottom:10px}
.status-badge{padding:6px 14px;border-radius:20px;font-weight:700;font-size:0.82rem}
.status-pending{background:rgba(240,185,11,0.15);color:#F0B90B;border:1px solid #F0B90B}
.status-approved{background:rgba(14,203,129,0.15);color:#0ECB81;border:1px solid #0ECB81}
.status-rejected{background:rgba(246,70,93,0.15);color:#F6465D;border:1px solid #F6465D}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.stat-card{background:#1E2329;border:1px solid #2B3139;border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all 0.2s}
.stat-card:hover,.stat-card.active{border-color:#F0B90B;background:#232830}
.stat-card h3{color:#707A8A;font-size:0.8rem;margin-bottom:4px}
.stat-card p{font-size:1.6rem;font-weight:900;color:#F0B90B}
.pending-card{background:#1E2329;border:1px solid #2B3139;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;transition:all 0.2s}
.pending-card .info{flex:1;min-width:150px}
.pending-card .info h4{font-size:0.95rem;margin-bottom:4px}
.pending-card .info p{color:#707A8A;font-size:0.78rem}
.tabs{display:flex;gap:6px;margin:20px 0;overflow-x:auto;padding-bottom:4px}
.tab{padding:10px 18px;border-radius:20px;background:#1E2329;border:1px solid #2B3139;color:#FFF;cursor:pointer;font-family:inherit;font-weight:700;font-size:0.82rem;white-space:nowrap;transition:all 0.2s;display:flex;align-items:center;gap:6px}
.tab.active{background:#F0B90B;color:#0B0E11;border-color:#F0B90B}
.tab-add{background:linear-gradient(135deg,#0ECB81,#0AB872);color:#FFF;border-color:#0ECB81}
.tab-add.active{background:linear-gradient(135deg,#0ECB81,#0AB872);color:#FFF;border-color:#0ECB81;box-shadow:0 4px 15px rgba(14,203,129,0.4)}
.site-footer{text-align:center;padding:20px;color:#707A8A;border-top:1px solid #1E2329;margin-top:24px;font-size:0.75rem}
.ios-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;padding:20px}
.ios-modal.active{display:flex}
.ios-modal-box{background:#1E2329;border:1px solid #2B3139;border-radius:16px;padding:24px;max-width:360px;text-align:center;position:relative}
.ios-modal-box h3{color:#F0B90B;font-size:1.1rem;margin-bottom:14px}
.ios-modal-box p{color:#B7BDC6;font-size:0.88rem;line-height:1.8;margin-bottom:8px}
.close-x{position:absolute;top:10px;left:14px;background:transparent;border:none;color:#707A8A;font-size:1.5rem;cursor:pointer}
.loading{text-align:center;padding:40px;color:#F0B90B}
.img-preview{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #F0B90B;margin:0 auto 10px;display:block;box-shadow:0 0 20px rgba(240,185,11,0.3)}
.img-preview-placeholder{width:120px;height:120px;border-radius:50%;background:#0B0E11;border:3px dashed #2B3139;display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:#4a5560;margin:0 auto 10px}
.file-input-label{display:block;background:#0B0E11;border:2px dashed #2B3139;border-radius:12px;padding:16px;text-align:center;cursor:pointer;color:#707A8A;transition:all 0.2s;font-size:0.9rem;font-weight:700}
.file-input-label:hover{border-color:#F0B90B;color:#F0B90B}
.file-input-label input{display:none}
.image-upload-section{text-align:center;margin-bottom:16px;padding:16px;background:#0B0E11;border-radius:12px;border:1px solid #2B3139}
.image-upload-section .upload-title{color:#F0B90B;font-weight:800;font-size:0.95rem;margin-bottom:12px}
.center-toggle{width:100%;background:transparent;border:1px solid #2B3139;color:#F0B90B;padding:14px;border-radius:12px;font-family:inherit;font-weight:800;font-size:0.92rem;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.center-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.center-btn{padding:10px 8px;background:#0B0E11;border:1px solid #2B3139;border-radius:12px;color:#FFF;cursor:pointer;font-family:inherit;font-weight:700;font-size:0.78rem;transition:all 0.2s;text-align:center}
.center-btn:hover{border-color:#F0B90B;color:#F0B90B}
.center-btn.active{background:#F0B90B;color:#0B0E11;border-color:#F0B90B}
.support-btn{background:linear-gradient(135deg,#25D366,#128C7E);color:#FFF;border-color:#25D366}
.add-hero{background:linear-gradient(135deg,rgba(14,203,129,0.15),rgba(14,203,129,0.05));border:2px solid rgba(14,203,129,0.35);border-radius:16px;padding:20px;text-align:center;margin-bottom:20px}
.add-hero h2{color:#0ECB81;font-size:1.2rem;font-weight:900;margin-bottom:6px}
.add-hero p{color:#B7BDC6;font-size:0.85rem}
@media (max-width:500px){
.doc-card{grid-template-columns:90px 1fr 16px;padding:14px;gap:12px}
.doc-avatar,.doc-avatar-ph{width:90px;height:90px;font-size:2.1rem}
.doc-name{font-size:0.98rem}
.stats-grid{grid-template-columns:1fr 1fr}
.days-grid{grid-template-columns:repeat(3,1fr)}
.time-row{grid-template-columns:1fr}
}
</style>
</head>

function getAmPmFromValue(val){
if(!val)return'';

}

function getHourFromValue(val){
if(!val)return'';
return val.replace(/\s*(صباحاً|مساءً|صباحا|مساء|ص|م)\s*$/g,'').trim();
}

function formatTimeRange(start,end){
if(!start||!end)return'';
return 'من '+formatTimeDisplay(start)+' إلى '+formatTimeDisplay(end);
}
