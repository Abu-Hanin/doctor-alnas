function $(s){return document.querySelector(s);}
function esc(str){if(!str)return'';var t=document.createElement('div');t.textContent=str;return t.innerHTML;}
function go(page,param){window.location.hash=param?'#'+page+'/'+param:'#'+page;}

/* ⭐ تنسيق الوقت بصيغة "صباحاً / مساءً" */
function formatTime(time24){
if(!time24)return'';
var parts=time24.split(':');
if(parts.length<2)return time24;
var h=parseInt(parts[0],10);
var m=parts[1];
var suffix=h>=12?'مساءً':'صباحاً';
h=h%12||12;
return h+':'+m+' '+suffix;
}

function formatTimeRange(start,end){
if(!start||!end)return'';
return 'من '+formatTime(start)+' إلى '+formatTime(end);
}

function autoFormatTime(input){
var val=input.value.trim();
if(!val)return;
val=val.replace(/\s/g,'');
var map={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
val=val.replace(/[٠-٩]/g,function(d){return map[d];});
var match=val.match(/^(\d{1,2})(?::(\d{0,2}))?$/);
if(match){
var h=parseInt(match[1],10);
var m=match[2]||'';
if(h>23)h=23;
if(m.length===0)m='00';
else if(m.length===1)m='0'+m;
else if(parseInt(m,10)>59)m='59';
input.value=(h<10?'0'+h:h.toString())+':'+m;
}
}

function normalizeTimeForSave(val){
if(!val)return'';
var v=val.trim().replace(/\s/g,'');
var match=v.match(/^(\d{1,2}):(\d{2})$/);
if(match){
var h=parseInt(match[1],10);
var m=match[2];
if(h>23)h=23;
return (h<10?'0'+h:h.toString())+':'+m;
}
return v;

}

if(!r2.error&&r2.data){newCount=r2.data.total_visits;}

else if(el&&el.parentElement){el.parentElement.style.display='none';}
}catch(e){}
}

function animateNumber(el,target){
var start=Math.max(0,target-20);
var duration=1200;
var t0=performance.now();
function tick(now){
var elapsed=now-t0;
var p=Math.min(elapsed/duration,1);
var eased=1-Math.pow(1-p,3);
var current=Math.floor(start+(target-start)*eased);
el.textContent=current.toLocaleString('en-US');
if(p<1)requestAnimationFrame(tick);
else el.textContent=target.toLocaleString('en-US');
}
requestAnimationFrame(tick);
}

}
};

}
}

async function adminAddDoctor(f){
var al=$('#add-alert');al.innerHTML='<div class="loading">⏳ جارٍ الإضافة...</div>';
var selectedDays=getSelectedDaysById('add-days-grid');
if(selectedDays.length===0){al.innerHTML='<div class="alert alert-danger">⚠️ يرجى اختيار يوم عمل واحد على الأقل</div>';window.scrollTo({top:0,behavior:'smooth'});return;}
var fullName=f.full_name.value.trim();
if(!fullName){al.innerHTML='<div class="alert alert-danger">⚠️ يرجى إدخال اسم الطبيب</div>';return;}
var imageUrl='';
var fileInput=f.image_file;
if(fileInput&&fileInput.files&&fileInput.files[0]){
var file=fileInput.files[0];
var ext=file.name.split('.').pop().toLowerCase();
var fileName='admin_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
var up=await supabaseClient.storage.from('doctor-images').upload(fileName,file,{contentType:file.type,upsert:true});
if(up.error){al.innerHTML='<div class="alert alert-danger">خطأ رفع الصورة: '+esc(up.error.message)+'</div>';return;}
var u=supabaseClient.storage.from('doctor-images').getPublicUrl(fileName);
imageUrl=u.data.publicUrl;
}
var fields=['full_name','specialty','sub_specialty','phone_private','phone1','phone2','governorate','city','region','address','qualifications','certificates','experience','about'];
var doc={};
fields.forEach(function(k){if(f[k])doc[k]=f[k].value.trim();});
if(f.email&&f.email.value.trim())doc.email=f.email.value.trim();
else doc.email='admin_'+Date.now()+'@doctor-alnas.local';
doc.work_days=selectedDays.join(',');
doc.work_start=normalizeTimeForSave(f.work_start.value);
doc.work_end=normalizeTimeForSave(f.work_end.value);
doc.image_url=imageUrl;
doc.status='approved';
doc.deleted=false;

}
